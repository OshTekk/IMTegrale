name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI full
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, linux, x64, pve-mini, IMTegrale]
    timeout-minutes: 360
    services:
      imtegrale-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: botnote_test
          POSTGRES_USER: botnote_ci
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botnote_ci -d botnote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOTNOTE_ENVIRONMENT: test
      BOTNOTE_DATABASE_URL: postgresql+psycopg://botnote_ci:postgres-ci-only@127.0.0.1:5432/botnote_test
      BOTNOTE_POSTGRES_TEST_URL: postgresql+psycopg://botnote_ci:postgres-ci-only@127.0.0.1:5432/botnote_test
    steps:
      - name: Verify the assigned repository runner
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "pve-mini-IMTegrale"
          test "$ACTUAL_RUNNER_OS" = "Linux"
          test "$ACTUAL_RUNNER_ARCH" = "X64"
          test "$ACTUAL_REPOSITORY" = "OshTekk/IMTegrale"
          case "$ACTUAL_EVENT_NAME" in
            push|pull_request|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_ACTIONS:-}" = "true"
          test -n "${GITHUB_JOB:-}"
          test -n "${GITHUB_WORKSPACE:-}"
          test -d "$GITHUB_WORKSPACE"
          test "$GITHUB_WORKSPACE" = "$EXPECTED_WORKSPACE"
          test "$(pwd -P)" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          test "$(basename "$GITHUB_WORKSPACE")" = "IMTegrale"
          printf 'Runner name: %s\n' "$ACTUAL_RUNNER_NAME"
          printf 'Runner OS: %s\n' "$ACTUAL_RUNNER_OS"
          printf 'Runner arch: %s\n' "$ACTUAL_RUNNER_ARCH"
          printf 'Repository: %s\n' "$ACTUAL_REPOSITORY"
          printf 'Event name: %s\n' "$ACTUAL_EVENT_NAME"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/requirements.lock
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Run repository-native full pipeline
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: python scripts/ci/run_full_pipeline.py run --write-github-summary
      - name: Upload the exact audited artifact
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imtegrale-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Download the same artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imtegrale-${{ github.sha }}
          path: downloaded-artifact
          digest-mismatch: error
      - name: Verify GitHub artifact round trip
        env:
          CI_GITHUB_ARTIFACT_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
        run: >-
          .ci-venv/bin/python scripts/ci/run_full_pipeline.py verify-transport
          --original artifacts
          --downloaded downloaded-artifact
          --write-github-summary
      - name: Clean repository-local CI runtime
        if: always()
        run: python scripts/ci/run_full_pipeline.py cleanup
