name: W2 Linux worker qualification
on:
  push:
    branches: [codex/w2-linux-qualification]
permissions:
  contents: read
concurrency:
  group: w2-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: w2_worker_test
          POSTGRES_USER: w2_synthetic
          POSTGRES_PASSWORD: w2-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2_synthetic -d w2_worker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      BOTNOTE_ENVIRONMENT: test
      BOTNOTE_DATABASE_URL: postgresql+psycopg://w2_synthetic:w2-disposable-only@127.0.0.1:5432/w2_worker_test
      BOTNOTE_POSTGRES_TEST_URL: postgresql+psycopg://w2_synthetic:w2-disposable-only@127.0.0.1:5432/w2_worker_test
      BOTNOTE_CREDENTIAL_KEY: cHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHA=
      BOTNOTE_TOKEN_PEPPER: synthetic-w2-pepper-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Public tree and W1 identity checks
        run: |
          python scripts/check_content_boundary.py
          python scripts/check_secrets.py
          python scripts/w2_verify_identity.py
          expected_root=92d9983dde54139c92418eb503137a6401553b6f
          mapfile -t roots < <(git rev-list --max-parents=0 HEAD)
          test "${#roots[@]}" -eq 1
          test "${roots[0]}" = "$expected_root"
          test "$(git rev-list --parents -n 1 "$expected_root")" = "$expected_root"
          git merge-base --is-ancestor "$expected_root" HEAD
      - name: Install isolated test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -q -e '.[dev]'
      - name: Syntax and static checks
        run: |
          .venv/bin/ruff check backend scripts
          .venv/bin/ruff check --select S backend/app
          .venv/bin/python -m compileall -q backend scripts
          git diff --check
      - name: Configure only the disposable test database schema
        run: |
          .venv/bin/python -c 'from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ["BOTNOTE_POSTGRES_TEST_URL"]); c=e.connect(); assert c.scalar(text("SHOW server_version_num"))[:2]=="17"; c.close()'
          .venv/bin/alembic upgrade head
      - name: Require real systemd and cgroup v2
        run: |
          test "$(cat /proc/1/comm)" = systemd
          systemctl --version | head -1
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo -n true
      - name: Diagnose one synthetic systemd credential
        run: >-
          .venv/bin/pytest -x -s backend/linux_tests
          -k startup_credentials_progress_identity_cgroups_restart_and_readiness
