name: W11 confined credstore synthetic Linux qualification

'on':
  push:
    branches:
      - codex/w10-maintenance-window

permissions:
  contents: read

concurrency:
  group: w10-maintenance-window
  cancel-in-progress: false

jobs:
  w9:
    if: >-
      github.repository == 'OshTekk/IMTegrale' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/w10-maintenance-window' &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false

      - name: Receive pinned ephemeral test inputs (never print private source)
        env:
          W11_EPHEMERAL_INPUT: ${{ secrets.W11_EPHEMERAL_SOURCE }}
        run: /usr/bin/python3 -B w11_ephemeral_input.py unpack "$RUNNER_TEMP/w11-ephemeral-input"

      - name: Offline regressions against exact private implementation (redacted)
        run: /usr/bin/python3 -B w11_ephemeral_input.py regressions "$RUNNER_TEMP/w11-ephemeral-input"

      - name: Preflight, full corrected experiment, then verify synthetic confinement
        timeout-minutes: 7
        env:
          W10_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          test "$W10_RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          /usr/bin/sudo -n /usr/bin/true
          /usr/bin/sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            W11_CREDSTORE_SOURCE="$RUNNER_TEMP/w11-ephemeral-input" \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import platform
          import re
          import signal
          import subprocess
          import sys
          import time

          EXPECTED = 'e799335a4c9651a1f7b1163d69e672ff34ecf912fcf747bb9894d0d95c737dc9'
          ORIGINAL_EXPECTED = 'db7256bb9815c549bdc5364311d99b4c07f7f296dbd53e027725c39216d18366'
          ROOT = Path('/var/lib/w9-maintenance-proof')
          ETC = Path('/etc/systemd/system')
          CGROOT = Path('/sys/fs/cgroup')
          SERVICES = tuple('w9-proof-' + role + '.service' for role in
                           ('general', 'sync', 'legacy', 'web', 'scheduler'))
          UNITS = (*SERVICES, 'w9-proof-legacy.timer', 'w9-proof-trigger.service')
          SCRIPT = Path.cwd() / 'w9_linux_window_diagnostic.py'
          DRIVER = Path.cwd() / 'w11_linux_coupling.py'
          spec = importlib.util.spec_from_file_location('w10_observe', Path.cwd() / 'w10_observe.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          observer = module.Observer()

          def observe(phase, groups, end, force=False):
              try:
                  observer.snapshot(phase, groups, end, force=force)
              except Exception as exc:
                  module.emit('observation_error', status=type(exc).__name__, result='UNKNOWN')

          def require(condition, reason):
              if not condition:
                  raise RuntimeError(reason)

          def call(*args, end, ok=True, quiet_stderr=False):
              remaining = end - time.monotonic()
              require(remaining > 0, 'phase deadline expired; never reopen admission')
              try:
                  result = subprocess.run(args, text=True, capture_output=True,
                                          timeout=min(10, remaining), check=False)
              except Exception as exc:
                  module.emit('command', operation=args[1], status=type(exc).__name__, rc=None,
                              unit=args[2] if args[1] == 'show' and args[2] in UNITS else None)
                  raise
              if args[1] in ('mask', 'daemon-reload', 'stop', 'kill'):
                  module.emit('containment_command', operation=args[1], rc=result.returncode,
                              stderr=module.redacted(result.stderr))
              require(not ok or result.returncode == 0,
                      'bounded command failed: ' + repr(args))
              require(not quiet_stderr or not result.stderr,
                      'unexpected command stderr; rc=' + str(result.returncode))
              return result.stdout

          def synthetic_processes(end):
              return module.synthetic_processes(end)

          def state(unit, end):
              text = call('/usr/bin/systemctl', 'show', unit,
                          '--property=Id,ActiveState,SubState,MainPID,ControlPID,Job,ControlGroup',
                          end=end)
              values = dict(line.split('=', 1) for line in text.splitlines() if '=' in line)
              require(values.get('Id') == unit, 'ambiguous synthetic unit identity')
              return values

          def masks_present():
              return all((ETC / unit).is_symlink() and
                         os.readlink(ETC / unit) == '/dev/null' for unit in UNITS)

          def contain(end):
              module.emit('containment_attempt', attempted=True)
              # Closure only: no unmask, unlink, evidence removal, or --cleanup.
              call('/usr/bin/systemctl', 'mask', *UNITS, end=end)
              fd = os.open(ETC, os.O_RDONLY | os.O_DIRECTORY)
              try:
                  os.fsync(fd)
                  module.emit("containment_fsync", succeeded=True)
              finally:
                  os.close(fd)
              call('/usr/bin/systemctl', 'daemon-reload', end=end)
              require(masks_present(), 'incomplete persistent closure')
              groups = {unit: state(unit, end).get('ControlGroup', '') for unit in UNITS}
              call('/usr/bin/systemctl', 'stop', '--no-block', *UNITS, end=end)
              # Inactive units may reject kill; the independent checks below decide success.
              call('/usr/bin/systemctl', 'kill', '--kill-whom=all', '--signal=SIGKILL',
                   *SERVICES, 'w9-proof-trigger.service', end=end, ok=False)
              while True:
                  observe('final_confinement', groups, end)
                  free = module.namespace_quiescent(groups, end, observer)
                  if free:
                      print('W10_CONTAINMENT_VERIFIED; LEFT MASKED; DESTROY RUNNER', flush=True)
                      return
                  require(time.monotonic() < end, 'synthetic residual; containment NOT verified')
                  time.sleep(0.1)

          def interrupted(signum, _frame):
              raise InterruptedError('interrupted: ' + str(signum))

          for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
              signal.signal(sig, interrupted)

          # Everything before the ownership boundary is read-only on the host.
          preflight_end = time.monotonic() + 45
          require(sys.platform == 'linux' and os.geteuid() == 0, 'disposable Linux root required')
          require(sys.executable == '/usr/bin/python3' and sys.version_info[:2] == (3, 12),
                  'expected system Python 3.12 required')
          release = platform.freedesktop_os_release()
          require(release.get('ID') == 'ubuntu' and release.get('VERSION_ID') == '24.04',
                  'Ubuntu 24.04 required')
          require(Path('/proc/1/comm').read_text().strip() == 'systemd', 'systemd PID1 required')
          require((CGROOT / 'cgroup.controllers').is_file(), 'cgroup v2 required')
          require(call('/usr/bin/stat', '-f', '-c', '%T', str(CGROOT),
                       end=preflight_end).strip() == 'cgroup2fs', 'cgroup v2 mount required')
          require(hashlib.sha256((Path.cwd() / 'w9_linux_window.py').read_bytes()).hexdigest() == ORIGINAL_EXPECTED,
                  'original W9 hash mismatch')
          require(SCRIPT.is_file() and not SCRIPT.is_symlink(), 'regular candidate file required')
          require(hashlib.sha256(SCRIPT.read_bytes()).hexdigest() == EXPECTED, 'candidate hash mismatch')
          require(not os.path.lexists(ROOT), 'synthetic root collision; no mutation permitted')
          require(not any(os.path.lexists(Path('/run/credentials') / unit) for unit in UNITS),
                  'synthetic credential directory collision')
          paths = call('/usr/bin/systemd-analyze', 'unit-paths', end=preflight_end).splitlines()
          require(paths and all(path.startswith('/') for path in paths), 'ambiguous unit search paths')
          for path in paths:
              folder = Path(path)
              if not folder.exists():
                  continue
              require(folder.is_dir(), 'ambiguous unit search directory')
              for pattern in ('w9-proof-*', '*.wants/w9-proof-*',
                              '*.requires/w9-proof-*', '*.upholds/w9-proof-*'):
                  require(not any(folder.glob(pattern)), 'synthetic unit or drop-in collision')
              for entry in folder.iterdir():
                  require(time.monotonic() < preflight_end, 'unit scan deadline expired')
                  if entry.is_symlink():
                      require(Path(os.readlink(entry)).name not in UNITS, 'synthetic alias collision')
          output = call('/usr/bin/systemctl', 'list-units', '--all', '--no-legend', '--no-pager',
                        'w9-proof-*', end=preflight_end)
          require(not output.strip(), 'preexisting synthetic unit collision')
          # systemd v255 returns -ENOENT for zero list-unit-files matches. Require a
          # successful full inventory, validate its rows, then filter only our prefix.
          output = call('/usr/bin/systemctl', 'list-unit-files', '--all', '--full',
                        '--no-legend', '--no-pager', end=preflight_end, quiet_stderr=True)
          rows = output.splitlines()
          require(rows, 'empty full unit-file inventory')
          states = {'enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias',
                    'masked', 'masked-runtime', 'static', 'disabled', 'indirect',
                    'generated', 'transient', 'bad'}
          for row in rows:
              fields = row.split()
              require(len(fields) == 3 and
                      re.fullmatch(r'[A-Za-z0-9:_.@\\-]+\.[a-z]+', fields[0]) and
                      fields[1] in states and fields[2] in {'enabled', 'disabled', 'ignored', '-'},
                      'invalid unit-file inventory row')
              require(not fields[0].startswith('w9-proof-'), 'preexisting synthetic unit collision')
          jobs = call('/usr/bin/systemctl', 'list-jobs', '--no-legend', '--no-pager', end=preflight_end)
          require('w9-proof-' not in jobs, 'synthetic job collision')
          def unreadable_cgroup(error):
              raise error

          for _folder, directories, _files in os.walk(CGROOT, followlinks=False,
                                                     onerror=unreadable_cgroup):
              require(time.monotonic() < preflight_end, 'cgroup scan deadline expired')
              require(not any(name.startswith('w9-proof-') for name in directories),
                      'synthetic cgroup collision')
          require(not synthetic_processes(preflight_end), 'synthetic process collision')
          require(time.monotonic() < preflight_end, 'preflight deadline expired')
          print('PREFLIGHT_PASSED; distinct diagnostic candidate; exclusive synthetic namespace', flush=True)

          # Namespace ownership has now been established; exactly one candidate invocation.
          driver = None
          result = None
          try:
              driver = subprocess.Popen(['/usr/bin/python3', '-I', '-B', str(DRIVER)], start_new_session=True)
              result = driver.wait(timeout=255)  # W9 alarm 240 s + 15 s external margin.
          except BaseException as exc:
              module.emit('initial_driver_failure', status=type(exc).__name__)
              raise
          finally:
              # Record W9 result before cleanup: secondary failures cannot erase it.
              module.emit('initial_result', driver_rc=result, driver_completed=result is not None)
              for sig in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                  signal.signal(sig, signal.SIG_IGN)
              termination_failed = False
              try:
                  if driver is not None:
                      try:
                          os.killpg(driver.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      driver.wait(timeout=5)
              except BaseException as exc:
                  termination_failed = True
                  module.emit('driver_termination_failure', status=type(exc).__name__)
              containment_end = time.monotonic() + 75
              try:
                  contain(containment_end)
              except BaseException as exc:
                  observe('final_confinement_failure', {}, containment_end, force=True)
                  module.emit('containment_result', verified=False, status=type(exc).__name__,
                              initial_driver_rc=result, result='NON_VERIFIE')
                  # Keep an active primary exception; otherwise fail explicitly below.
                  containment_failed = True
              else:
                  containment_failed = False
                  module.emit('containment_result', verified=True)
              # Do not raise from finally over an active driver failure.
          require(result == 0, 'W9 failed; admission remains closed; no retry')
          require(not containment_failed and not termination_failed,
                  'final confinement or driver termination failed; NON VERIFIED')
          print('BOUNDED_SYSTEMD_WINDOW_QUALIFIED; SYNTHETIC_SCOPE_ONLY; NO_REBOOT_OR_DB_CERTIFICATION', flush=True)
          PY

      - name: Remove only the exact ephemeral private test inputs
        if: always()
        run: /usr/bin/python3 -B w11_ephemeral_input.py cleanup "$RUNNER_TEMP/w11-ephemeral-input"
